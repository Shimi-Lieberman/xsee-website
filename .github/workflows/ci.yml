name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tier 2A handoff self-test + forbidden patterns
        env:
          HANDOFF_DIR: ${{ github.workspace }}/scripts/fixtures
        run: |
          bash scripts/check-forbidden-patterns.sh --self-test
          npm run check:forbidden
      - run: npm run lint
      - run: npm run build
